services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piisw
      POSTGRES_USER: piisw
      POSTGRES_PASSWORD: piisw
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piisw -d piisw"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/piisw
      DB_USERNAME: piisw
      DB_PASSWORD: piisw
      JWT_SECRET: "31530584-9fa4-4131-baaf-4a240eb098b5-d9c8b1e5e7a-4c8b-4e5a-9c1b-2f3e5a6b7c8d"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
