databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: piisw
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-wallets
      author: piisw
      changes:
        - createTable:
            tableName: wallets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_wallet_user
                    references: users(id)
              - column:
                  name: balance
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-ticket-definitions
      author: piisw
      changes:
        - createTable:
            tableName: ticket_definitions
            columns:
              - column:
                  name: id
                  type: VARCHAR(60)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INT
              - column:
                  name: validity_days
                  type: INT

  - changeSet:
      id: 004-create-tickets
      author: piisw
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: VARCHAR(40)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_owner
                    references: users(id)
              - column:
                  name: definition_id
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_definition
                    references: ticket_definitions(id)
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: duration_minutes
                  type: INT
              - column:
                  name: validity_days
                  type: INT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: purchase_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: validation_time
                  type: TIMESTAMP
              - column:
                  name: vehicle_id
                  type: VARCHAR(40)
              - column:
                  name: valid_until
                  type: TIMESTAMP
