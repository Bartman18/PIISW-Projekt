spring:
  application:
    name: piisw-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:11000011101110000100101010011111}
    expiration-minutes: 120
  cors:
    allowed-origin: http://localhost:4200

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:piisw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/piisw}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:piisw}
    password: ${DB_PASSWORD:piisw}
